name: Native NDD
on:
  push:
    branches: [main, parallel]
  pull_request:
    branches: [main, parallel]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build C and JNI
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build native/build -j2
      - name: Native differential and GC tests
        run: |
          nproc
          lscpu
          ctest --test-dir native/build --output-on-failure
      - name: Cached MC image with forced label GC
        run: |
          cmake -S native -B native/build-mc-gc -DCMAKE_BUILD_TYPE=Debug -DPNDD_BUILD_JNI=OFF -DPNDD_MC_IMAGE_PAIR_CACHE=ON -DPNDD_MC_TEST_GC=ON
          cmake --build native/build-mc-gc --target pndd_mc_relnext_test -j2
          ctest --test-dir native/build-mc-gc -R '^pndd_mc_relnext_' --output-on-failure
      - name: Oversubscribed workers and GC
        run: |
          cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          taskset -c "$cpus" ctest --test-dir native/build -R '^pndd_correctness_6$' --output-on-failure
      - name: Java integration and legacy regression tests
        run: mvn --batch-mode --no-transfer-progress -Dpndd.tests=true -Dpndd.library="$PWD/native/build/libpnddjni.so" verify
      - name: Sanitizers
        run: |
          cmake -S native -B native/build-asan -DCMAKE_BUILD_TYPE=Debug -DPNDD_SANITIZE=ON -DPNDD_BUILD_JNI=OFF
          cmake --build native/build-asan -j2
          ASAN_OPTIONS=detect_leaks=1 native/build-asan/pndd_test 1
