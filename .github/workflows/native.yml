name: Native NDD
on:
  push:
    branches: [main, parallel]
  pull_request:
    branches: [main, parallel]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build C and JNI
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build native/build -j2
      - name: Native differential and GC tests
        run: ctest --test-dir native/build --output-on-failure
      - name: Java integration and legacy regression tests
        run: mvn --batch-mode --no-transfer-progress -Dpndd.tests=true -Dpndd.library="$PWD/native/build/libpnddjni.so" verify
      - name: Sanitizers
        run: |
          cmake -S native -B native/build-asan -DCMAKE_BUILD_TYPE=Debug -DPNDD_SANITIZE=ON -DPNDD_BUILD_JNI=OFF
          cmake --build native/build-asan -j2
          ASAN_OPTIONS=detect_leaks=1 native/build-asan/pndd_test 1
