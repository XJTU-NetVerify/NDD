name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Test
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Run quick start
        run: java -cp target/ndd-1.0.1-jar-with-dependencies.jar application.examples.ProductConfigurationExample
